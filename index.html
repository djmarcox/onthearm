<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onThearm.com — Coming Soon</title>
<meta name="description" content="onThearm.com. This one's on the house. Coming soon.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2314213d'/%3E%3Cpath fill='%23c9a227' d='M12 12h40v14h-6v-6h-8v28h6v6H20v-6h6V20h-8v6h-6z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #14213d;
    --navy-dark: #0a1022;
    --cream: #f1ece2;
    --gold: #c9a227;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at center, #1c2d52 0%, var(--navy) 55%, var(--navy-dark) 100%);
    color: var(--cream);
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .sign {
    border: 4px solid var(--gold);
    outline: 2px solid var(--gold);
    outline-offset: 8px;
    padding: 48px 32px 40px;
    max-width: 720px;
    width: 100%;
    border-radius: 6px;
  }
  .est {
    letter-spacing: 0.4em;
    text-transform: uppercase;
    font-size: 0.85rem;
    color: var(--gold);
  }
  h1 {
    font-family: 'Alfa Slab One', Georgia, serif;
    font-weight: 400;
    font-size: clamp(2.2rem, 9vw, 4.6rem);
    line-height: 1.1;
    margin: 18px 0 10px;
    color: var(--cream);
    text-shadow: 3px 3px 0 var(--navy-dark);
    word-break: break-word;
  }
  h1 .t { color: var(--gold); }
  .rule {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 22px auto;
    max-width: 360px;
    color: var(--gold);
  }
  .rule::before, .rule::after {
    content: "";
    flex: 1;
    height: 2px;
    background: var(--gold);
  }
  .tagline {
    font-size: clamp(1.2rem, 4vw, 1.6rem);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 600;
  }
  .soon {
    margin-top: 28px;
    display: inline-block;
    background: var(--gold);
    color: var(--navy);
    padding: 10px 26px;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    border-radius: 3px;
  }
  footer {
    margin-top: 32px;
    font-size: 0.8rem;
    opacity: 0.6;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
  <main class="sign">
    <div class="est">Est. Way Back When</div>
    <h1>on<span class="t">T</span>hearm.com</h1>
    <div class="rule">★</div>
    <p class="tagline">This one's on the house.</p>
    <div class="soon">Coming Soon</div>
    <footer>&copy; 2026 onThearm.com</footer>
  </main>
</body>
</html>
