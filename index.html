<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onThearm.com — Coming Soon</title>
<meta name="description" content="onThearm.com. This one's on the house. Coming soon.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000;
    --white: #fff;
    --gray: #8c8c8c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .sign {
    border: 2px solid var(--white);
    outline: 1px solid var(--gray);
    outline-offset: 8px;
    padding: 40px 32px 36px;
    max-width: 560px;
    width: 100%;
  }
  .logo {
    display: block;
    width: min(240px, 60vw);
    margin: 0 auto;
  }
  h1 {
    font-family: Impact, 'Anton', 'Arial Narrow', sans-serif;
    font-weight: 400;
    font-size: clamp(2.8rem, 10vw, 4.4rem);
    line-height: 1;
    margin: 24px 0 6px;
    letter-spacing: 0.01em;
    word-break: break-word;
  }
  .rule {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 18px auto;
    max-width: 300px;
    color: var(--gray);
    font-size: 0.8rem;
  }
  .rule::before, .rule::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--gray);
  }
  .tagline {
    font-size: clamp(1.1rem, 4vw, 1.4rem);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 400;
    color: #cfcfcf;
  }
  .soon {
    font-family: Impact, 'Anton', 'Arial Narrow', sans-serif;
    font-weight: 400;
    margin-top: 26px;
    display: inline-block;
    border: 2px solid var(--white);
    padding: 9px 26px;
    font-size: 1.1rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
  }
  .contact {
    font-family: Impact, 'Anton', 'Arial Narrow', sans-serif;
    margin-top: 22px;
    font-size: 1.15rem;
    letter-spacing: 0.12em;
    color: #cfcfcf;
  }
  .contact a {
    color: var(--white);
    text-decoration: none;
    border-bottom: 1px solid var(--gray);
  }
  .contact a:hover { border-bottom-color: var(--white); }
  footer {
    margin-top: 30px;
    font-size: 0.8rem;
    font-weight: 300;
    color: var(--gray);
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
  <main class="sign">
    <img class="logo" src="logo/ota-logo.svg" alt="onThearm logo">
    <h1>onThearm.com</h1>
    <div class="rule">★</div>
    <p class="tagline">This one's on the house.</p>
    <div class="soon">Coming Soon</div>
    <p class="contact">Get in touch: <span id="email">hello [at] onthearm.com</span></p>
    <footer>&copy; 2026 onThearm.com</footer>
  </main>
  <script>
    // Assemble the address in the browser so spam bots reading the HTML don't see it
    var addr = ['hello', 'onthearm.com'].join('@');
    var link = document.createElement('a');
    link.href = 'mailto:' + addr;
    link.textContent = addr;
    document.getElementById('email').replaceWith(link);
  </script>
</body>
</html>
